# 配置模板 — 复制为 config.yaml 后填写，请勿提交含敏感信息的实际配置
# 框架不内置任何人格、记忆内容

onebot:
  ws_url: "ws://127.0.0.1:15701"
  http_url: "http://127.0.0.1:15700"
  access_token: ""
  expect_uin: 0            # 期望登录的账号，0=不校验

guard:
  max_failures: 3          # 连续失败几次后熔断
  base_backoff_sec: 2.0
  max_backoff_sec: 60.0
  jitter: 0.3
  alert_tag: "My Bot"      # 告警标题前缀，填你自己的机器人名

notifier:
  file: "logs/alerts.jsonl"
  console: true
  # webhook_url: ""        # 可选，填则启用 HTTP 通知
  # toast: false           # 可选，系统托盘气泡

rate_limit:
  per_minute: 30
  per_hour: 200
  per_day: 1000
  ai_quota_day: 500

llm:
  # 由部署方自行配置模型与密钥
  # base_url: ""
  # api_key: ""
  # model: ""
